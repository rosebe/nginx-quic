worker_processes auto;
daemon off;
error_log /tmp/pgo-run/logs/error.log;
pid /tmp/pgo-run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    # 训练 Stream 版本的 GeoIP2 模块
    geoip2 /tmp/pgo-run/geoip/GeoLite2-Country.mmdb {
        $geoip2_data_country_code_stream country iso_code;
    }
	map $ssl_preread_server_name $backend {
        # example.com  127.0.0.1:8081; 
        #example.com  127.0.0.1:8083; 
		# 完美闭环：wrk(https) -> 8443(Stream透传) -> 8082(HTTP SSL完美握手解密)
    	example.com  127.0.0.1:8083; 
		default      127.0.0.1:8083; 
    }
    server {
        listen 8443;
        proxy_pass $backend;
        ssl_preread on;
    }
}

http {
    # 路径必须与 Stage 2 脚本中 mkdir 的路径严格一致
    client_body_temp_path /tmp/pgo-run/client_body_temp;
    proxy_temp_path       /tmp/pgo-run/proxy_temp;
    fastcgi_temp_path     /tmp/pgo-run/fastcgi_temp;
    uwsgi_temp_path       /tmp/pgo-run/uwsgi_temp;
    scgi_temp_path        /tmp/pgo-run/scgi_temp;

    geoip2 /tmp/pgo-run/geoip/GeoLite2-Country.mmdb { $geoip2_data_country_code country iso_code; }
    
	# 补全 WebSocket 变量定义
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    server {
        listen 8081 ; # 关键：必须开启 http2 才能训练 gRPC 模块
        http2 on;
		add_header X-IP-Country $geoip2_data_country_code;

        # 1. 真正的 gRPC 转发逻辑 (训练 ngx_http_grpc_module)
        location /helloworld.Greeter/SayHello {
            grpc_pass grpc://127.0.0.1:50051; 
        }

        # 2. WebSocket 逻辑
        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 即使后端不存在，握手逻辑也能被训练
            proxy_pass http://127.0.0.1:8083; 
        }

        # 3. 默认兜底
        location / {
            return 200 "PGO training content";
        }
    }

    # 模拟一个普通的明文后端，专为 Stream 模块提供闭环应答
    server {
        listen 8083;
        location / { return 200 "stream_backend_ok"; }
    }
	
	# 模拟一个合法的 SSL 后端，让 openssl 能够闭环完成 TLS 握手，将错误彻底清零
	# 它不再接收 Stream 的错乱流量，而是专门接收我们在外部发起的直接 HTTPS 请求，以此来强力训练 HTTP 模块的 TLS 解密逻辑！
    server {
        listen 8082 ssl;
        # 兼容性修正：移除 http2 on; 避免 stream 模块通过 openssl s_client 探测时发生协议冲突
		#http2 on;

        # PGO 训练无需真实合规证书，直接指向 Nginx 自带的或随便一个临时证书即可
        # 如果你没准备证书，可以使用下面两行（或者指向你现有的证书路径）
        #ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
        #ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
		# 使用 Stage 2 脚本中自生成的本地证书，100% 避免系统证书缺失导致的崩溃
		ssl_certificate /tmp/pgo-run/server.crt;
		ssl_certificate_key /tmp/pgo-run/server.key;

        location / { 
            #return 200 "backend_ok_pgo_trained";
			return 200 "http_ssl_backend_pgo_trained";
        }
    }

}
