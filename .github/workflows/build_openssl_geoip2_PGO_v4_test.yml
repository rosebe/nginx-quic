# This is a basic workflow to help you get started with Actions

name: build nginx-quic with Openssl , support ngx_http_geoip2_module PGO_v4_test

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  #push:
    #branches:
      #- main
      #- b*
      #- E*
  #pull_request:
    #branches:
      #- main
      #- b*
      #- E* 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  release:
    types: [published]
    
# Set time zone
env:
  TZ: Asia/Shanghai

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    #runs-on: ubuntu-24.04
    runs-on: ubuntu-latest
    
    if: github.event.repository.owner.id == github.event.sender.id
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
                              
      # Runs a set of commands using the runners shell
      - name: depend
        run: |
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install build-essential ca-certificates \
                               zlib1g-dev libpcre3 libpcre3-dev libssl-dev \
                               git cmake ninja-build gnupg2 lsb-release libunwind-dev \
                               tar unzip  wget curl tree perl-base
          sudo add-apt-repository ppa:maxmind/ppa
          sudo apt install libmaxminddb0 libmaxminddb-dev mmdb-bin
          sudo apt-get install -y libtool automake autoconf wrk golang-go bc

      #- name: Setup Go environment
      #  uses: actions/setup-go@v4.0.1
      #  with:
      #   go-version: ^1.20
      #   check-latest: true
  
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
         version: 16
         platform: x64
      
      - name: openssl
        env: 
          #OPENSSL_COMMIT_ID_LOCAL : dcc2a2dcd4120543aa8a967e26dcd5dba20053d1
          
          OPENSSL_COMMIT_ID_LOCAL : ae24bfbd40e10b923bb9a7df7106d0d398201b69
        run: |
          #git clone -b openssl-3.1.0+quic https://github.com/quictls/openssl.git
          #git clone -b openssl-3.1.0+quic+locks https://github.com/quictls/openssl.git
          #git clone https://github.com/openssl/openssl.git
          git clone --recurse-submodules -b openssl-4.1 --depth 1 https://github.com/openssl/openssl.git
          cd openssl
          #git checkout .
          #git pull

          #git fetch --depth 1 origin ${OPENSSL_COMMIT_ID_LOCAL}
          #git reset --hard ${OPENSSL_COMMIT_ID_LOCAL}
          
          ##git fetch --depth 1 origin dcc2a2dcd4120543aa8a967e26dcd5dba20053d1
          ##git reset --hard dcc2a2dcd4120543aa8a967e26dcd5dba20053d1
          
          git submodule update --init --recursive
          echo "Openssl_Commit_ID=$(git rev-parse --short HEAD) " >> $GITHUB_ENV
          
          #mkdir build
          #cd build
          #../Configure
          #sudo make -j$(nproc --all)
          #sudo make install
          #sudo ldconfig /usr/local/lib64/
          #openssl version -d
          cd ..
                      
      - name: brotli
        run: |
          git clone --recurse-submodules -j8 https://github.com/google/ngx_brotli
          cd ngx_brotli/deps/brotli
          mkdir out && cd out
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS="-Ofast -m64 -march=native -mtune=native -flto -funroll-loops -ffunction-sections -fdata-sections -Wl,--gc-sections" -DCMAKE_CXX_FLAGS="-Ofast -m64 -march=native -mtune=native -flto -funroll-loops -ffunction-sections -fdata-sections -Wl,--gc-sections" -DCMAKE_INSTALL_PREFIX=./installed ..
          cmake --build . --config Release --target brotlienc
          cd ../../../..
          
      - name: zlib-cf
        run: |
          git clone -b gcc.amd64  https://github.com/cloudflare/zlib.git zlib-cf
          cd zlib-cf
          make -f Makefile.in distclean
          git checkout .
          git pull
          git submodule update --init --recursive
          cd ..

      - name: zstd 
        run: |
          git clone https://github.com/tokers/zstd-nginx-module.git
          #cd zlib-cf
          #cd ..
      
      - name: GeoLite2
        run: |
          git clone https://github.com/leev/ngx_http_geoip2_module.git
          cd ngx_http_geoip2_module
          git checkout .
          git pull
          cd ..
      
      - name: pcre2
        run: |
          git clone --recurse-submodules https://github.com/PCRE2Project/pcre2.git
          cd pcre2
          #git checkout .
          #git pull
          ./autogen.sh
          cd ..

      #- name: Set up GCC
        #uses: egor-tensin/setup-gcc@v1.3
        #with:
         #version: 12
         #platform: x64
         
                        
      # --- 第一阶段：插桩编译 (Instrument Build) ---
      - name: Stage 1 - Instrument Build
        run: |
          
          git clone https://github.com/nginx/nginx.git
          cd nginx
         
          echo "Commit_ID=$(git rev-parse --short HEAD) " >> $GITHUB_ENV
          
          curl https://raw.githubusercontent.com/rosebe/nginx-quic/refs/heads/master/nginx_dynamic_tls_records.patch | patch --verbose -p 1
          
          ./auto/configure \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --add-module=../zstd-nginx-module \
            --add-module=../ngx_brotli \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --with-zlib=../zlib-cf \
            --with-http_v3_module \
            --add-module=../ngx_http_geoip2_module \
            --with-openssl=../openssl  \
            --with-openssl-opt='enable-ktls no-comp no-shared enable-tls1_3' \
            --build="Commit ID: $(git rev-parse --short HEAD). Rosebe Add patch: Dynamic TLS Record support. And build on $(date +%Y_%m_%d-%H:%M:%S)" \
            --with-cc-opt='-static -static-libgcc -Ofast -march=x86-64-v3 -flto=auto -fprofile-generate=/tmp/pgo-data' \
            --with-ld-opt='-static -flto=auto -fprofile-generate=/tmp/pgo-data'
           
          
          make -j$(nproc)
          cd ..

      - name: Stage 2 - Full Scenario Training (PGO)
        run: |
            # 1. [变量拼接协议 - 防裁剪]
            G_RAW="https://raw.githubusercontent.com"
            G_PROTO_PATH="/grpc/grpc-go/master/examples/helloworld/helloworld/helloworld.proto"
            G_HOST="https://github.com"
            G_REPO="/grpc/grpc-go.git"
            
            NGINX_BIN="/home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx"
            G_WORKSPACE="${{ github.workspace }}"

            # 2. [环境整备]
            sudo apt-get update && sudo apt-get install -y wrk openssl
            rm -rf /tmp/pgo-run /tmp/pgo-data
            mkdir -p /tmp/pgo-run/{proto,geoip,logs,client_body_temp,proxy_temp,fastcgi_temp,uwsgi_temp,scgi_temp} /tmp/pgo-data
            chmod -R 777 /tmp/pgo-run /tmp/pgo-data

            # 3. [资源分发]
            cp "$G_WORKSPACE/pgo.conf" /tmp/pgo-run/pgo.conf
            cp "$G_WORKSPACE/GeoLite2-Country.mmdb" /tmp/pgo-run/geoip/GeoLite2-Country.mmdb
            curl -Lf -sSL "${G_RAW}${G_PROTO_PATH}" -o /tmp/pgo-run/proto/helloworld.proto

            go install "github.com/bojand/ghz/cmd/ghz@latest"
            export PATH=$PATH:$(go env GOPATH)/bin

            # --- [启动 gRPC 桩服务] ---
            git clone --depth 1 "${G_HOST}${G_REPO}"
            cd grpc-go/examples/helloworld/greeter_server
            go run main.go > /tmp/grpc-backend.log 2>&1 &
            BACKEND_PID=$!
            cd -

            # [重要：等待 gRPC 后端就绪]
            echo ">> 等待 gRPC 后端 (50051) 就绪..."
            timeout 30s bash -c 'until nc -z localhost 50051; do sleep 1; done' || echo "⚠️ gRPC 后端启动超时"


            # 5. [插桩启动 - 核心修正：启动前导出变量]
            echo ">> 启动插桩版 Nginx (Path: /tmp/pgo-data)..."
            export GCOV_PREFIX="/tmp/pgo-data"
            export GCOV_PREFIX_STRIP=0
            # 使用 -E 传递环境变量给 sudo 
            sudo -E "$NGINX_BIN" -p /tmp/pgo-run -c /tmp/pgo-run/pgo.conf > /tmp/pgo-run/logs/stdout.log 2>&1 &
            NGINX_PID=$!
            
            # [重要：等待 Nginx 端口就绪]
            echo ">> 等待 Nginx (8081) 就绪..."
            timeout 10s bash -c 'until nc -z localhost 8081; do sleep 1; done' || exit 1

            
            #sleep 5
            #kill -0 $NGINX_PID || { cat /tmp/pgo-run/logs/stdout.log; exit 1; }

            # 6. [精准压测]
            # A. Stream 压测优化 (OpenSSL s_client)
            echo ">>  Stream 压测优化 (使用 OpenSSL 触发 ssl_preread)..."

            # 临时调高系统文件描述符限制
            ulimit -n 65535 2>/dev/null || true
            
            timeout 15 bash -c '
              RESULT_LOG=$(mktemp)
              FIFO_FILE=$(mktemp -u)
              mkfifo "$FIFO_FILE"
              # 创建文件描述符 6 绑定到管道，并删除临时文件（保持管道在内存中）
              exec 6<>"$FIFO_FILE"
              rm -f "$FIFO_FILE"
            
              # 1. 【2 Threads 实现】：向管道中写入 2 个令牌，代表 2 个并行 Worker 线程
              for i in {1..2}; do echo >&6; done
            
              clean_up() {
                echo ">> 压测超时或结束，正在清理残留进程..."
                exec 6>&- # 关闭文件描述符
                pkill -P $$ openssl 2>/dev/null || true
              }
              trap clean_up SIGTERM SIGINT EXIT
            
              echo "Running 12s test @ https://127.0.0.1:8443 (TLS SNI: example.com)"
              echo "  4 threads (simulated) and 200 concurrent connections"
              
              BENCH_START=$(date +%s.%N)
              DURATION_LIMIT=12.0
            
              # 2. 【200 并发控制】：外层时间控制，内部并发交替
              while true; do
                CURRENT_TIME=$(date +%s.%N)
                ELAPSED=$(echo "$CURRENT_TIME $BENCH_START" | awk "{print \$1 - \$2}")
                
                if (( $(echo "$ELAPSED >= $DURATION_LIMIT" | bc -l) )); then
                  break
                fi
            
                current_batch_pids=()
                
                # 发起 200 并发连接
                for i in {1..200}; do
                  # 从管道中读取一个令牌（如果没有空闲线程，此处会阻塞等待）
                  read -u 6
                  
                  (
                    # 拿到令牌后，多线程 Worker 开始执行工作
                    REQ_START=$(date +%s.%N)
                    echo "QUIT" | openssl s_client -connect 127.0.0.1:8443 -servername example.com -quiet >/dev/null 2>&1
                    STATUS=$?
                    REQ_END=$(date +%s.%N)
                    
                    LATENCY=$(echo "$REQ_END $REQ_START" | awk "{print (\$1 - \$2) * 1000}")
                    echo "$LATENCY $STATUS" >> "$RESULT_LOG"
                    
                    # 任务完成后，归还令牌到管道，供下一个连接使用
                    echo >&6
                  ) &
                  current_batch_pids+=($!)
                done
                
                # 等待这 200 个连接交替处理完毕
                wait "${current_batch_pids[@]}" 2>/dev/null || true
                
                # 极短的间歇，防止本地 TCP 端口在 12 秒内过快枯竭
                usleep 5000 2>/dev/null || sleep 0.005
              done
            
              # 关闭管道描述符
              exec 6>&-
            
              # ----------------------------------------------------
              #  数据统计与高仿 wrk 报告输出
              # ----------------------------------------------------
              echo "--------------------------------------------------"
              echo ">> 压测结果反馈报告 (Stream TLS Handshake):"
              
              awk -v duration="$DURATION_LIMIT" '
              BEGIN {
                count = 0; success = 0; fail = 0; sum = 0; max = 0; min = 999999;
              }
              {
                count++;
                latency = $1; status = $2;
                sum += latency;
                if (latency > max) max = latency;
                if (latency < min) min = latency;
                if (status == 0) success++; else fail++;
                arr[count] = latency;
              }
              END {
                if (count == 0) {
                  print "  [错误] 未收集到压测数据，请确认 8443 端口是否正常监听！";
                  exit;
                }
                avg = sum / count;
                
                # 标准差计算
                sq_sum = 0;
                for (i = 1; i <= count; i++) sq_sum += (arr[i] - avg) ^ 2;
                stdev = sqrt(sq_sum / count);
                
                # 百分位数排序
                for (i = 1; i <= count; i++) {
                  for (j = i + 1; j <= count; j++) {
                    if (arr[i] > arr[j]) { tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
                  }
                }
                
                p50 = arr[int(count * 0.50) + 1];
                p75 = arr[int(count * 0.75) + 1];
                p90 = arr[int(count * 0.90) + 1];
                p99 = arr[int(count * 0.99) + 1];
                rps = count / duration;
            
                printf "  Thread Stats   Avg      Stdev     Max\n";
                printf "    Latency    %.2fms    %.2fms    %.2fms\n", avg, stdev, max;
                printf "  Latency Distribution\n";
                printf "     50%%    %.2fms\n", p50;
                printf "     75%%    %.2fms\n", p75;
                printf "     90%%    %.2fms\n", p90;
                printf "     99%%    %.2fms\n", p99;
                printf "  %d requests completed in %.2fs\n", count, duration;
                printf "  Socket errors: connect %d, handshake_fail %d\n", fail, fail;
                printf "Requests/sec:      %.2f\n", rps;
              }
              ' "$RESULT_LOG"
            
              rm -f "$RESULT_LOG"
              trap - SIGTERM SIGINT EXIT
              ' || true

            
            # B. gRPC (增加容错，避免 502 导致 Action 中断)
            echo ">>  gRPC Stream 压测优化..."
            #ghz --insecure --proto /tmp/pgo-run/proto/helloworld.proto \
            #    --call helloworld.Greeter.SayHello -n 1000 127.0.0.1:8081 || true
            
            # 优化方案：为了让 GCC 记录下高并发下的线程锁（Mutex）、内存分配（malloc/free）以及连接池复用逻辑，应当增加总请求量，并显式指定高并发数（-c）和持续时间（-z）。
            # -c 100: 保持 100 个并发连接
            # -n 20000: 提升到 2 万次请求，确保压测持续一定时间
            # --timeout 2s: 避免慢请求卡住
            ghz --insecure --proto /tmp/pgo-run/proto/helloworld.proto \
                --call helloworld.Greeter.SayHello \
                -c 100 -n 20000 --timeout 2s 127.0.0.1:8081 || true 

            # C. HTTP/WS (指向 8081)
            echo ">>  HTTP/WebSocket 压测优化 ..."
            #wrk -t2 -c50 -d10s -H "Upgrade: websocket" -H "Connection: Upgrade" http://127.0.0.1:8081
            
            # 假设测试机有 4 核（-t4），并发提升到 200（-c200），时间保持 10~15 秒（-d12s）
            # 这样可以让 CPU 满载，以便 GCC 精准捕捉热点函数
            wrk -t2 -c200 -d12s -H "Upgrade: websocket" -H "Connection: Upgrade" --latency http://127.0.0.1:8081

            
            # 7. [收割数据]
            echo ">> 正在触发 Profile 数据落盘..."
            [ -n "$NGINX_PID" ] && sudo kill -QUIT $NGINX_PID || true
            [ -n "$BACKEND_PID" ] && kill $BACKEND_PID || true
            sleep 10
            
            echo ">> 最终统计成果："
            find /tmp/pgo-data -name "*.gcda" | wc -l



      
      # --- 第三阶段：最终极致编译 (Final Optimization) ---
      - name: Stage 3 - Final Build
        run: |
          cd nginx
          #make clean
          rm -rf /home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx
          find /home/runner/work/nginx-quic/nginx-quic/nginx/objs -name "*.o" -delete
          ./auto/configure \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib64/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/var/run/nginx.pid \
            --lock-path=/var/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-file-aio \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --add-module=../zstd-nginx-module \
            --add-module=../ngx_brotli \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --with-zlib=../zlib-cf \
            --with-http_v3_module \
            --add-module=../ngx_http_geoip2_module \
            --with-openssl=../openssl  \
            --with-openssl-opt='enable-ktls no-comp no-shared enable-tls1_3' \
            --build="Commit ID: $(git rev-parse --short HEAD). Openssl_Commit_ID: ${{ env.Openssl_Commit_ID }}. Rosebe Add patch: Dynamic TLS Record support. PGO (Profile Guided Optimization) enabled. compatible x86-64-v4 (AVX-512). And build on $(date +%Y_%m_%d-%H:%M:%S)" \
            --with-cc-opt='-static -static-libgcc -Ofast -march=x86-64-v4 -flto=auto -fprofile-use -fprofile-correction -fprofile-dir=/tmp/pgo-data' \
            --with-ld-opt='-static -flto=auto -fprofile-use -fprofile-dir=/tmp/pgo-data'
            
            #--with-cc-opt='-static -static-libgcc -Ofast -march=x86-64-v4 -flto=auto -fprofile-use=/tmp/pgo-data -fprofile-correction' \
            #--with-ld-opt='-static -flto=auto -fprofile-use=/tmp/pgo-data' 
            
          
          make -j$(nproc)
          
          # 使用 -B 强制重新编译所有目标，但不会执行删除动作
          #make -j$(nproc) -B
          
          # 在 Stage 3 结尾添加
          ls -lh objs/nginx
          file objs/nginx     # 确认是否为 statically linked
          ldd objs/nginx || true  # 确认是否报 'not a dynamic executable' (代表静态链接成功)
      
          
      - name: Strip and Package
        run: |
          # 1. 瘦身：去除调试符号，文件将从 19M 通常能缩减到 5-8M 左右
          strip --strip-all /home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx
          # 验证优化后的最终体积        
          ls -lh /home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx
                  
          # 归档上传
          # tar -czvf nginx-pgo-v4-static.tar.gz -C nginx/objs nginx

          
            
      - uses: actions/upload-artifact@v7
        with:
          name: nginx-quic.Openssl
          path: /home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx
      
        # Setting an environment variable
        # https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions
      - name: Set variables
        id: step_one
        shell: bash
        run: |
          echo "ASSET_NAME=nginx-quic-static v$(grep "#define NGINX_VERSION" /home/runner/work/nginx-quic/nginx-quic/nginx/src/core/nginx.h | awk '{print $3}' | tr -d '"') ${{ env.Commit_ID }} Enable_OpenSSL and support ngx_http_geoip2_module PGO v4 test build on $(date +%Y_%m_%d-%H:%M:%S)" >> $GITHUB_ENV
          echo "TAG_NAME=v$(grep "#define NGINX_VERSION" /home/runner/work/nginx-quic/nginx-quic/nginx/src/core/nginx.h | awk '{print $3}' | tr -d '"')" >> $GITHUB_ENV
          echo "RELEASE_NAME=nginx-quic" v$(grep "#define NGINX_VERSION" /home/runner/work/nginx-quic/nginx-quic/nginx/src/core/nginx.h | awk '{print $3}' | tr -d '"')>> $GITHUB_ENV
          
          echo "TAG_NAME: "
          echo "${{ env.TAG_NAME }}"
          echo ""
          echo "RELEASE_NAME: "
          echo "${{ env.RELEASE_NAME }}"
          echo ""
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}, RELEASE_NAME: $(GITHUB_RELEASE_NAME) , TAG_NAME: ${GITHUB_TAG_NAME}"
          echo ""
          echo "RELEASE_NAME: ${{ env.RELEASE_NAME }} "
          echo "TAG_NAME: ${{ env.TAG_NAME }} "
          echo ""
          echo "TAG_NAME 1: ${{ env.TAG_NAME }} "
          echo "TAG_NAME 2: $env.TAG_NAME "
          echo "TAG_NAME 3: $TAG_NAME "
          echo "TAG_NAME 4:" $TAG_NAME
          echo "TAG_NAME 5: ""${{ env.TAG_NAME }} "
          echo ""
          echo "RELEASE_NAME 5: "
          echo "${{ env.RELEASE_NAME }}"
          echo ""
          echo "GITHUB_WORKFLOW is:" $GITHUB_WORKFLOW
          echo "GITHUB_ENV 1: "$GITHUB_ENV
          echo "GITHUB_ENV 2: ${GITHUB_ENV} "       
              
      - name: Use variables
        id: step_two
        shell: bash
        run: |
          echo "TAG_NAME: "
          echo "${{ env.TAG_NAME }}"
          echo ""
          echo "RELEASE_NAME: "
          echo "${{ env.RELEASE_NAME }}"
          echo ""
          echo "ASSET_NAME: "
